# Configurazione opzionale per il deploy su Render (https://render.com).
# Se usi "New + > Blueprint" e punti alla repo, Render legge questo file.
# In alternativa puoi creare il Web Service manualmente (vedi ISTRUZIONI.md).
services:
  - type: web
    name: tongue-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: NEWS_LANGUAGE
        value: it
